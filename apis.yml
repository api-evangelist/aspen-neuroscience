description: 'Aspen Neuroscience is a clinical-stage biotechnology company developing personalized
  regenerative cell therapies for Parkinson''s disease. Its lead candidate, ANPD001, is an autologous
  induced pluripotent stem cell (iPSC)-derived neuron replacement therapy that uses a patient''s own
  cells to restore dopamine function without requiring immunosuppression, with manufacturing designed
  for scalable, reproducible production. The company was surfaced as a portfolio company of GV (Google
  Ventures) and added to the API Evangelist network. It operates a corporate website only and publishes
  no public developer API, documentation, or specification surface at this time; artifact coverage here
  is limited to domain/identity signals.'
